<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポケモン図鑑番号検定</title>
<style>
body {
    font-family: system-ui, sans-serif;
    margin: 0;
    padding: 10px;
    background: #f5f5f5;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    font-size: 1.4em;
    margin-bottom: 10px;
}

select, input, button {
    width: 100%;
    font-size: 1.1em;
    padding: 10px;
    margin: 8px 0;
}

#status {
    text-align: center;
    font-size: 1.1em;
    margin: 10px 0;
}

#timer {
    font-weight: bold;
    color: red;
}

.hidden {
    display: none;
}

.gen-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
    margin: 10px 0;
    border: 1px solid #ccc;
    padding: 5px;
    border-radius: 5px;
}

.gen-container label {
    position: relative;
    padding-left: 5px;
    display: block;
    height: 25px;
    line-height: 25px;
}

.gen-container input[type="checkbox"] {
    position: absolute;
    top: 0;
    right: 0;
    transform: scale(1.2);
}

.gen-note {
    font-size: 0.9em;
    color: #555;
    margin-bottom: 10px;
}

#message {
    margin: 10px 0;
    white-space: pre-wrap;
    font-size: 1.05em;
}
</style>
</head>
<body>
<div class="container">

<h1>ポケモン図鑑番号検定</h1>

<label>モード選択</label>
<select id="modeSelect">
    <option value="num2poke" selected>番号→ポケモン</option>
    <option value="poke2num">ポケモン→番号</option>
</select>

<label>ルール選択</label>
<select id="ruleSelect">
    <option value="endless" selected>エンドレス</option>
    <option value="timeattack">タイムアタック</option>
</select>

<div id="timeWrapper">
    <label>制限時間選択</label>
    <select id="timeSelect">
        <option value="0">制限時間なし</option>
        <option value="3">3秒</option>
        <option value="5" selected>5秒</option>
        <option value="10">10秒</option>
        <option value="20">20秒</option>
        <option value="30">30秒</option>
        <option value="45">45秒</option>
        <option value="60">60秒</option>
    </select>
</div>

<label>世代選択</label>
<div class="gen-container">
    <label><input type="checkbox" value="all" checked> 全て</label>
    <label><input type="checkbox" value="kanto" checked> カントー</label>
    <label><input type="checkbox" value="johto" checked> ジョウト</label>
    <label><input type="checkbox" value="hoenn" checked> ホウエン</label>
    <label><input type="checkbox" value="sinnoh" checked> シンオウ</label>
    <label><input type="checkbox" value="unova" checked> イッシュ</label>
    <label><input type="checkbox" value="kalos" checked> カロス</label>
    <label><input type="checkbox" value="alola" checked> アローラ</label>
    <label><input type="checkbox" value="galar" checked> ガラル</label>
    <label><input type="checkbox" value="paldea" checked> パルデア</label>
</div>
<div class="gen-note">※メルタン→アローラ　ヒスイ→ガラル</div>

<div id="bestContainer">
    <div id="bestTitle"></div>
    <div id="bestBody"></div>
</div>

<div id="message"></div>
<button id="startBtn">ゲーム開始</button>

<div id="game" class="hidden">
    <div id="status">
        出題：<span id="number"></span><br>
        ⏱ <span id="timer"></span><br>
        正解数：<span id="score">0</span>
    </div>
    <input id="answer" placeholder="答えを入力" autocomplete="off">
    <button id="checkBtn" style="padding:24px 10px;">判定</button>
</div>

<script>
// ======= グローバル変数 =======
let pokemon = {};
let numbers = [];
let currentNumber = null;
let timer = null;
let attackTimer = null;
let timeLeft = 0;
let limit = 5;
let score = 0;
let elapsed = 0;
let attackPool = [];
let isPlaying = false;
let isNewRecord = false;

// 世代範囲
const genRanges = {
    kanto:[1,151], johto:[152,251], hoenn:[252,386], sinnoh:[387,493],
    unova:[494,649], kalos:[650,721], alola:[722,809], galar:[810,905], paldea:[906,1025]
};

// DOM
const modeSelect = document.getElementById("modeSelect");
const ruleSelect = document.getElementById("ruleSelect");
const timeSelect = document.getElementById("timeSelect");
const genCheckboxes = document.querySelectorAll(".gen-container input[type='checkbox']");
const messageDiv = document.getElementById("message");
const startBtn = document.getElementById("startBtn");
const checkBtn = document.getElementById("checkBtn");
const answerInput = document.getElementById("answer");

// ======= ユーティリティ =======
function normalizeJP(str){
    return str.normalize("NFKC").replace(/[\u3041-\u3096]/g, ch=>String.fromCharCode(ch.charCodeAt(0)+0x60));
}

function formatHMS_Game(sec){
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600)/60);
    const s = sec % 60;
    if(h===0) return `${m}:${String(s).padStart(2,"0")}`;
    return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function formatHMS_Result(sec){
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600)/60);
    const s = sec % 60;
    if(h===0) return `${m}分${String(s).padStart(2,"0")}秒`;
    return `${h}時間${String(m).padStart(2,"0")}分${String(s).padStart(2,"0")}秒`;
}

// ======= データ読み込み =======
fetch("pokemon.json")
    .then(r=>r.json())
    .then(data=>{
        pokemon = data;
        numbers = Object.keys(pokemon).map(Number);
        updateBest();
    })
    .catch(()=>alert("pokemon.json の読み込みに失敗しました"));

// ======= 世代選択 =======
function getSelectedNumbers(){
    let selected = [];
    let allChecked = true;
    genCheckboxes.forEach(cb=>{
        if(cb.value!=="all"){
            if(cb.checked){
                const [s,e] = genRanges[cb.value];
                for(let i=s;i<=e;i++) selected.push(i);
            }else allChecked=false;
        }
    });
    if(allChecked){
        selected=[];
        Object.values(genRanges).forEach(([s,e])=>{
            for(let i=s;i<=e;i++) selected.push(i);
        });
    }
    return {nums:selected, allChecked};
}

// ======= ゲーム開始 =======
function startGame(){
    if(!pokemon || Object.keys(pokemon).length===0){
        alert("ポケモンデータ読み込み待ちです");
        return;
    }
    isPlaying = true;
    score = 0;
    elapsed = 0;
    attackPool = [];
    document.getElementById("score").textContent = score;
    document.getElementById("game").classList.remove("hidden");
    messageDiv.textContent = "";
    answerInput.value = "";
    answerInput.focus();
    clearInterval(timer);
    clearInterval(attackTimer);

    if(ruleSelect.value==="timeattack"){
        attackPool = getSelectedNumbers().nums.slice();
        document.getElementById("timer").textContent = formatHMS_Game(elapsed);
        attackTimer = setInterval(()=>{
            elapsed++;
            document.getElementById("timer").textContent = formatHMS_Game(elapsed);
        },1000);
    }else{
        limit = Number(timeSelect.value);
    }

    nextQuestion();
}

// ======= 出題 =======
function nextQuestion(){
    clearInterval(timer);
    const {nums} = getSelectedNumbers();
    if(nums.length===0){ alert("世代を選択してください"); return; }

    if(ruleSelect.value==="timeattack"){
        if(attackPool.length===0){
            gameOver("🎉 全問クリア！");
            return;
        }
        const idx = Math.floor(Math.random()*attackPool.length);
        currentNumber = attackPool.splice(idx,1)[0];
    }else{
        if(limit===0){
            document.getElementById("timer").textContent="∞";
        }else{
            timeLeft = limit;
            document.getElementById("timer").textContent=timeLeft;
            timer = setInterval(()=>{
                timeLeft--;
                document.getElementById("timer").textContent=timeLeft;
                if(timeLeft<=0) gameOver("時間切れ！");
            },1000);
        }
        currentNumber = nums[Math.floor(Math.random()*nums.length)];
    }

    const numberEl = document.getElementById("number");
    numberEl.textContent = modeSelect.value==="num2poke"?currentNumber:pokemon[currentNumber];
    numberEl.style.color = modeSelect.value==="num2poke"?"blue":"black";
    answerInput.value = "";
    answerInput.focus();
}

// ======= 判定 =======
function checkAnswer(){
    clearInterval(timer);
    const input = normalizeJP(answerInput.value.trim());
    const correct = modeSelect.value==="num2poke"?normalizeJP(pokemon[currentNumber]):String(currentNumber);
    if(input===correct){
        score++;
        document.getElementById("score").textContent = score;
        nextQuestion();
    }else{
        gameOver("不正解！");
    }
}

// ======= ゲームオーバー =======
function gameOver(reason){
    clearInterval(timer);
    clearInterval(attackTimer);
    isPlaying=false;
    document.getElementById("game").classList.add("hidden");

    let msg = reason + `\nスコア：${score}`;
    const correctAnswer = modeSelect.value==="num2poke"?pokemon[currentNumber]:currentNumber;
    msg += `\n答えは「${correctAnswer}」`;
    if(ruleSelect.value==="timeattack"){
        msg += `\nタイム：${formatHMS_Result(elapsed)}`;
    }
    messageDiv.textContent = msg;
    updateBest();
}

// ======= 最高記録表示（簡易版） =======
function updateBest(){
    document.getElementById("bestTitle").textContent = "";
    document.getElementById("bestBody").textContent = "";
}

// ======= イベント =======
startBtn.addEventListener("click", startGame);
checkBtn.addEventListener("click", checkAnswer);
answerInput.addEventListener("keydown", e=>{ if(e.key==="Enter") checkAnswer(); });

</script>
</body>
</html>
